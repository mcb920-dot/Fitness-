<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fat Loss" />
  <title>Fat Loss + Testosterone Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0D0D0D; }
    body { -webkit-font-smoothing: antialiased; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input::placeholder { color: #48484A; }
    textarea::placeholder { color: #48484A; }
    ::-webkit-scrollbar { display: none; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ── PALETTE ──────────────────────────────────────────────────────────────
    const A  = "#FF6B35";   // orange accent
    const A2 = "#30D158";   // green checks
    const CH = "#1C1C1E";   // charcoal
    const DK = "#0D0D0D";   // dark bg
    const LT = "#8E8E93";   // light grey text
    const RL = "#2C2C2E";   // rule / input bg

    // ── DATA ─────────────────────────────────────────────────────────────────
    const DAYS     = ["Tue", "Thu", "Sat"];
    const WORKOUTS = { Tue: "Lower Body Strength", Thu: "Upper Body (Shoulder Friendly)", Sat: "Full Body Strength" };
    const EXERCISES = {
      Tue: ["Squat", "Romanian Deadlift", "Leg Press", "Lunges", "Leg Curl", "Calf Raise"],
      Thu: ["Bench Press", "Dumbbell Row", "Shoulder Press", "Cable Row", "Lateral Raise", "Tricep Pushdown"],
      Sat: ["Deadlift", "Pull-Up / Lat Pulldown", "Incline Press", "Face Pull", "Farmer's Carry", "Core Work"],
    };
    const NUTR_CHECKS = ["40–60g protein per meal","Whole, minimally processed foods","Veggies with 2+ meals","Healthy fats included","Hydration goal met"];
    const TEST_CHECKS = ["Protein at every meal","Healthy fats consumed","Training / recovery done","Sunlight exposure","7–8 hours of sleep"];
    const MOBILITY    = ["90/90 hip stretch – 1 min/side","Hip flexor stretch – 1 min/side","Deep squat hold – 60 sec","Glute bridges – 3 x 15","Band pull-aparts – 3 x 15","Wall slides – 3 x 10","Dead hang – 20 sec x 3"];
    const TARGETS     = [["Calories","1,900–2,200"],["Protein","190–210g"],["Carbs","60–90g"],["Fat","80–100g"],["Water","90–120oz"],["Sleep","7–8 hrs"]];
    const MEALS       = ["Breakfast","Lunch","Dinner","Snack"];
    const METRICS     = ["Weight (lbs)","Energy (1–10)","Gym Strength (1–10)","Hunger Control (1–10)","Sleep Quality (1–10)"];

    // ── STORAGE ──────────────────────────────────────────────────────────────
    const KEY = "fatLoss_v1";
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
    const save = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };

    function getWeekKey(d = new Date()) {
      const jan1 = new Date(d.getFullYear(), 0, 1);
      const w = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
      return `${d.getFullYear()}_w${w}`;
    }

    // ── UI PRIMITIVES ─────────────────────────────────────────────────────────
    const Card = ({ children, style: sx = {} }) => (
      <div style={{ background: CH, borderRadius: 12, padding: "12px 14px", marginBottom: 10, ...sx }}>
        {children}
      </div>
    );

    const Label = ({ children }) => (
      <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 7, marginTop: 6 }}>
        <div style={{ width: 3, height: 14, background: A, borderRadius: 2, flexShrink: 0 }} />
        <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.12em", color: A, textTransform: "uppercase" }}>
          {children}
        </span>
      </div>
    );

    const Inp = ({ value, onChange, placeholder, type = "text", style: sx = {} }) => (
      <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
        style={{ background: RL, border: "none", borderRadius: 7, padding: "8px 9px", color: "#F0F0F0",
                 fontSize: 13, width: "100%", outline: "none", fontFamily: "inherit", ...sx }} />
    );

    const Tabs = ({ tabs, active, onChange }) => (
      <div style={{ display: "flex", background: RL, borderRadius: 9, padding: 3, marginBottom: 12 }}>
        {tabs.map(t => (
          <button key={t} onClick={() => onChange(t)}
            style={{ flex: 1, padding: "7px 4px", borderRadius: 7, border: "none", cursor: "pointer",
                     fontSize: 12, fontWeight: 600, fontFamily: "inherit", transition: "all 0.18s",
                     background: active === t ? A : "transparent", color: active === t ? "#fff" : LT }}>
            {t}
          </button>
        ))}
      </div>
    );

    const Check = ({ checked, onToggle, label }) => (
      <div onClick={onToggle}
        style={{ display: "flex", alignItems: "flex-start", gap: 10, cursor: "pointer",
                 padding: "6px 0", borderBottom: `1px solid ${RL}` }}>
        <div style={{ width: 16, height: 16, borderRadius: 4, flexShrink: 0, marginTop: 1,
                      border: checked ? "none" : `1.5px solid ${LT}`, background: checked ? A2 : "transparent",
                      display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.15s" }}>
          {checked && <span style={{ color: "#fff", fontSize: 11, fontWeight: 700, lineHeight: 1 }}>✓</span>}
        </div>
        <span style={{ fontSize: 13, color: checked ? LT : "#F0F0F0", lineHeight: 1.4,
                       textDecoration: checked ? "line-through" : "none", transition: "all 0.15s" }}>
          {label}
        </span>
      </div>
    );

    // ── TODAY SCREEN ──────────────────────────────────────────────────────────
    function TodayScreen({ data, setData }) {
      const today = new Date().toISOString().split("T")[0];
      const dk = `day_${today}`;
      const day = data[dk] || {};

      const upd = (field, val) => {
        const next = { ...data, [dk]: { ...day, [field]: val } };
        setData(next); save(next);
      };

      const toggle = (group, idx, len) => {
        const arr = [...(day[group] || Array(len).fill(false))];
        arr[idx] = !arr[idx];
        upd(group, arr);
      };

      const nc = day.nutr || Array(NUTR_CHECKS.length).fill(false);
      const tc = day.test || Array(TEST_CHECKS.length).fill(false);
      const mc = day.mob  || Array(MOBILITY.length).fill(false);

      const todayShort = new Date().toLocaleDateString("en-US", { weekday: "long" }).slice(0, 3);
      const isTraining = DAYS.includes(todayShort);

      const sum = k => MEALS.reduce((a, m) => a + (parseFloat(day[`${m}_${k}`]) || 0), 0);
      const p = sum("pro"), c = sum("carb"), f = sum("fat"), cal = sum("cal");

      return (
        <div>
          {/* Date banner */}
          <div style={{ background: DK, borderRadius: 12, padding: "11px 14px",
                        marginBottom: 10, borderLeft: `3px solid ${A}` }}>
            <div style={{ fontSize: 11, color: LT, marginBottom: 2 }}>
              {new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}
            </div>
            {isTraining
              ? <div style={{ fontSize: 13, color: A2, fontWeight: 600 }}>🏋️ Training Day — {WORKOUTS[todayShort]}</div>
              : <div style={{ fontSize: 13, color: LT }}>Recovery Day — Stay consistent</div>
            }
          </div>

          {/* Target cards */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 5, marginBottom: 10 }}>
            {TARGETS.map(([lbl, val]) => (
              <div key={lbl} style={{ background: CH, borderRadius: 9, padding: "7px 5px",
                                      textAlign: "center", borderTop: `2px solid ${A}` }}>
                <div style={{ fontSize: 8, color: LT, letterSpacing: "0.07em",
                               textTransform: "uppercase", marginBottom: 1 }}>{lbl}</div>
                <div style={{ fontSize: 11, color: A, fontWeight: 700 }}>{val}</div>
              </div>
            ))}
          </div>

          {/* Nutrition log */}
          <Label>Nutrition Log</Label>
          <Card>
            {/* Column headers */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 50px 50px 50px 56px",
                          gap: 5, marginBottom: 6 }}>
              {["Food / Description", "Pro g", "Carb g", "Fat g", "Cal ↓"].map(h => (
                <div key={h} style={{ fontSize: 9, color: LT, textAlign: h === "Food / Description" ? "left" : "center",
                                      letterSpacing: "0.05em", textTransform: "uppercase" }}>{h}</div>
              ))}
            </div>
            {MEALS.map(meal => (
              <div key={meal} style={{ marginBottom: 8 }}>
                <div style={{ fontSize: 9, color: LT, fontWeight: 600, letterSpacing: "0.07em",
                               textTransform: "uppercase", marginBottom: 3 }}>{meal}</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 50px 50px 50px 56px", gap: 5 }}>
                  <Inp value={day[`${meal}_food`] || ""} onChange={v => upd(`${meal}_food`, v)} placeholder="e.g. Eggs, rice..." />
                  <Inp value={day[`${meal}_pro`]  || ""} onChange={v => upd(`${meal}_pro`,  v)} placeholder="0" type="number" style={{ textAlign: "center" }} />
                  <Inp value={day[`${meal}_carb`] || ""} onChange={v => upd(`${meal}_carb`, v)} placeholder="0" type="number" style={{ textAlign: "center" }} />
                  <Inp value={day[`${meal}_fat`]  || ""} onChange={v => upd(`${meal}_fat`,  v)} placeholder="0" type="number" style={{ textAlign: "center" }} />
                  <Inp value={day[`${meal}_cal`]  || ""} onChange={v => upd(`${meal}_cal`,  v)} placeholder="0" type="number"
                    style={{ textAlign: "center", borderLeft: `2px solid ${A}55` }} />
                </div>
              </div>
            ))}
            {/* Totals row */}
            <div style={{ borderTop: `1px solid ${RL}`, paddingTop: 8, marginTop: 4,
                          display: "flex", justifyContent: "space-around" }}>
              {[["Protein", p ? p+"g" : "—"], ["Carbs", c ? c+"g" : "—"], ["Fat", f ? f+"g" : "—"], ["Calories", cal || "—"]].map(([l, v]) => (
                <div key={l} style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 9, color: LT, textTransform: "uppercase", marginBottom: 2 }}>{l}</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: l === "Calories" ? A : "#F0F0F0" }}>{v}</div>
                </div>
              ))}
            </div>
          </Card>

          {/* Checklists */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
            <div>
              <Label>Nutrition</Label>
              <Card style={{ padding: "8px 10px" }}>
                {NUTR_CHECKS.map((item, i) => (
                  <Check key={i} checked={nc[i]} label={item} onToggle={() => toggle("nutr", i, NUTR_CHECKS.length)} />
                ))}
              </Card>
            </div>
            <div>
              <Label>Testosterone</Label>
              <Card style={{ padding: "8px 10px" }}>
                {TEST_CHECKS.map((item, i) => (
                  <Check key={i} checked={tc[i]} label={item} onToggle={() => toggle("test", i, TEST_CHECKS.length)} />
                ))}
              </Card>
            </div>
          </div>

          {/* Mobility */}
          <Label>Daily Mobility</Label>
          <Card style={{ padding: "8px 12px" }}>
            {MOBILITY.map((item, i) => (
              <Check key={i} checked={mc[i]} label={item} onToggle={() => toggle("mob", i, MOBILITY.length)} />
            ))}
          </Card>

          {/* Notes */}
          <Label>Notes</Label>
          <textarea value={day.notes || ""} onChange={e => upd("notes", e.target.value)}
            placeholder="Wins, struggles, anything worth remembering..."
            style={{ width: "100%", minHeight: 80, background: CH, border: "none", borderRadius: 12,
                     padding: "12px 14px", color: "#F0F0F0", fontSize: 13, fontFamily: "inherit",
                     outline: "none", resize: "vertical", lineHeight: 1.5 }} />
        </div>
      );
    }

    // ── WORKOUT SCREEN ────────────────────────────────────────────────────────
    function WorkoutScreen({ data, setData }) {
      const [activeDay, setActiveDay] = useState(() => {
        const s = new Date().toLocaleDateString("en-US", { weekday: "long" }).slice(0, 3);
        return DAYS.includes(s) ? s : "Tue";
      });
      const today = new Date().toISOString().split("T")[0];
      const wk = `workout_${today}_${activeDay}`;
      const w = data[wk] || {};

      const upd = (field, val) => {
        const next = { ...data, [wk]: { ...w, [field]: val } };
        setData(next); save(next);
      };

      const exs = EXERCISES[activeDay];
      const done = exs.filter(e => w[`${e}_done`]).length;

      return (
        <div>
          <Tabs tabs={DAYS} active={activeDay} onChange={setActiveDay} />

          <div style={{ background: DK, borderRadius: 12, padding: "10px 14px", marginBottom: 10,
                        borderLeft: `3px solid ${A}` }}>
            <div style={{ fontSize: 13, color: A, fontWeight: 700 }}>{WORKOUTS[activeDay]}</div>
            <div style={{ fontSize: 11, color: LT, marginTop: 2 }}>
              {done}/{exs.length} exercises logged
            </div>
          </div>

          {/* Column headers */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 58px 58px 58px 38px",
                        gap: 5, padding: "0 0 5px 0" }}>
            {["Exercise", "Sets", "Reps", "lbs", "✓"].map(h => (
              <div key={h} style={{ fontSize: 9, color: LT, textAlign: h === "Exercise" ? "left" : "center",
                                     textTransform: "uppercase", letterSpacing: "0.06em" }}>{h}</div>
            ))}
          </div>

          {exs.map(ex => (
            <Card key={ex} style={{ padding: "9px 12px", marginBottom: 6 }}>
              <div style={{ fontSize: 12, color: w[`${ex}_done`] ? LT : "#F0F0F0",
                             fontWeight: 600, marginBottom: 5,
                             textDecoration: w[`${ex}_done`] ? "line-through" : "none" }}>{ex}</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 58px 58px 58px 38px", gap: 5, alignItems: "center" }}>
                <div />
                <Inp value={w[`${ex}_sets`]   || ""} onChange={v => upd(`${ex}_sets`,   v)} placeholder="—" type="number" style={{ textAlign: "center" }} />
                <Inp value={w[`${ex}_reps`]   || ""} onChange={v => upd(`${ex}_reps`,   v)} placeholder="—" type="number" style={{ textAlign: "center" }} />
                <Inp value={w[`${ex}_weight`] || ""} onChange={v => upd(`${ex}_weight`, v)} placeholder="—" type="number" style={{ textAlign: "center" }} />
                <div onClick={() => upd(`${ex}_done`, !w[`${ex}_done`])}
                  style={{ width: 34, height: 34, borderRadius: 7, cursor: "pointer",
                           border: w[`${ex}_done`] ? "none" : `1.5px solid ${LT}`,
                           background: w[`${ex}_done`] ? A2 : "transparent",
                           display: "flex", alignItems: "center", justifyContent: "center",
                           fontSize: 16, transition: "all 0.15s" }}>
                  {w[`${ex}_done`] ? "✓" : ""}
                </div>
              </div>
            </Card>
          ))}

          <Label>Workout Notes</Label>
          <textarea value={w.notes || ""} onChange={e => upd("notes", e.target.value)}
            placeholder="PRs, energy level, anything to remember..."
            style={{ width: "100%", minHeight: 70, background: CH, border: "none", borderRadius: 12,
                     padding: "12px 14px", color: "#F0F0F0", fontSize: 13, fontFamily: "inherit",
                     outline: "none", resize: "vertical", lineHeight: 1.5 }} />
        </div>
      );
    }

    // ── PROGRESS SCREEN ───────────────────────────────────────────────────────
    function ProgressScreen({ data, setData }) {
      const wk = `progress_${getWeekKey()}`;
      const prog = data[wk] || {};

      const upd = (field, val) => {
        const next = { ...data, [wk]: { ...prog, [field]: val } };
        setData(next); save(next);
      };

      const weights = Array.from({ length: 6 }, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - i * 7);
        const val = parseFloat((data[`progress_${getWeekKey(d)}`] || {})["Weight (lbs)"]);
        return isNaN(val) ? null : val;
      }).reverse();

      const valid = weights.filter(Boolean);
      const hasW = valid.length > 0;
      const maxW = hasW ? Math.max(...valid) : 200;
      const minW = hasW ? Math.min(...valid) : 150;
      const rng  = maxW - minW || 10;

      return (
        <div>
          <Label>This Week</Label>
          <Card>
            {METRICS.map(m => (
              <div key={m} style={{ marginBottom: 9 }}>
                <div style={{ fontSize: 9, color: LT, textTransform: "uppercase",
                               letterSpacing: "0.07em", marginBottom: 3 }}>{m}</div>
                <Inp value={prog[m] || ""} onChange={v => upd(m, v)}
                     placeholder={m.includes("lbs") ? "e.g. 194.5" : "Rate 1–10"} type="number" />
              </div>
            ))}
          </Card>

          {hasW && (
            <>
              <Label>Weight Trend (6 weeks)</Label>
              <Card>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 5, height: 90, marginBottom: 4 }}>
                  {weights.map((w, i) => {
                    const filled = w !== null;
                    const h = filled ? ((w - minW) / rng) * 65 + 18 : 6;
                    return (
                      <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column",
                                             alignItems: "center", gap: 3 }}>
                        <div style={{ fontSize: 9, color: filled ? A : "transparent", fontWeight: 700, minHeight: 11 }}>
                          {filled ? w : ""}
                        </div>
                        <div style={{ width: "100%", borderRadius: 4, transition: "height 0.4s ease",
                                       height: h + "px",
                                       background: filled ? (i === 5 ? A : A + "88") : RL }} />
                        <div style={{ fontSize: 8, color: LT }}>W{i + 1}</div>
                      </div>
                    );
                  })}
                </div>
                {valid.length >= 2 && (
                  <div style={{ textAlign: "center", fontSize: 11, color: LT, marginTop: 4 }}>
                    {valid[valid.length-1] < valid[0]
                      ? <span style={{ color: A2 }}>↓ {(valid[0] - valid[valid.length-1]).toFixed(1)} lbs lost</span>
                      : <span style={{ color: "#FF453A" }}>↑ {(valid[valid.length-1] - valid[0]).toFixed(1)} lbs gained</span>
                    }
                    {" "}over {valid.length} weeks
                  </div>
                )}
              </Card>
            </>
          )}

          <Label>Weekly Notes</Label>
          <textarea value={prog.notes || ""} onChange={e => upd("notes", e.target.value)}
            placeholder="Weekly reflection, adjustments to make..."
            style={{ width: "100%", minHeight: 80, background: CH, border: "none", borderRadius: 12,
                     padding: "12px 14px", color: "#F0F0F0", fontSize: 13, fontFamily: "inherit",
                     outline: "none", resize: "vertical", lineHeight: 1.5 }} />
        </div>
      );
    }

    // ── APP SHELL ─────────────────────────────────────────────────────────────
    function App() {
      const [screen, setScreen] = useState("today");
      const [data, setData]     = useState(() => load());

      const NAV = [
        { id: "today",    label: "Today",    icon: "☀️" },
        { id: "workout",  label: "Workout",  icon: "🏋️" },
        { id: "progress", label: "Progress", icon: "📈" },
      ];

      const titles = { today: "Today", workout: "Workout", progress: "Progress" };

      return (
        <div style={{ maxWidth: 430, margin: "0 auto", minHeight: "100vh", minHeight: "100dvh",
                      background: DK, color: "#F0F0F0",
                      fontFamily: "'SF Pro Display', -apple-system, 'Helvetica Neue', sans-serif",
                      display: "flex", flexDirection: "column" }}>

          {/* Header */}
          <div style={{ background: CH, padding: "52px 16px 10px",
                        borderBottom: `1px solid ${RL}`, position: "sticky", top: 0, zIndex: 10 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div>
                <div style={{ fontSize: 9, color: A, fontWeight: 700,
                               letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 1 }}>
                  Fat Loss + Testosterone
                </div>
                <div style={{ fontSize: 18, fontWeight: 700, letterSpacing: "-0.02em" }}>
                  {titles[screen]}
                </div>
              </div>
              <div style={{ background: DK, borderRadius: 8, padding: "5px 10px",
                             fontSize: 11, color: LT, fontWeight: 600 }}>
                {new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" })}
              </div>
            </div>
          </div>

          {/* Scrollable content */}
          <div style={{ flex: 1, overflowY: "auto", padding: "12px 12px 90px",
                        WebkitOverflowScrolling: "touch" }}>
            {screen === "today"    && <TodayScreen    data={data} setData={setData} />}
            {screen === "workout"  && <WorkoutScreen  data={data} setData={setData} />}
            {screen === "progress" && <ProgressScreen data={data} setData={setData} />}
          </div>

          {/* Bottom nav */}
          <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
                        width: "100%", maxWidth: 430, background: CH,
                        borderTop: `1px solid ${RL}`, display: "flex",
                        padding: "8px 0 28px", zIndex: 10 }}>
            {NAV.map(n => (
              <button key={n.id} onClick={() => setScreen(n.id)}
                style={{ flex: 1, background: "none", border: "none", cursor: "pointer",
                         display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
                         fontFamily: "inherit", padding: "4px 0" }}>
                <div style={{ fontSize: 21 }}>{n.icon}</div>
                <div style={{ fontSize: 10, fontWeight: 600, transition: "color 0.2s",
                               color: screen === n.id ? A : LT }}>{n.label}</div>
                {screen === n.id && (
                  <div style={{ width: 18, height: 3, background: A, borderRadius: 2, marginTop: 1 }} />
                )}
              </button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
